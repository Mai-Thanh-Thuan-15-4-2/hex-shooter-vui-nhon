<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hex Shooter Vui Nhộn - Bắn Súng Lia Tâm</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  background:#0a0a12; 
  color:#fff; 
  font-family: 'Segoe UI', system-ui, sans-serif; 
  overflow:hidden; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:100vh;
}
#game { 
  border:2px solid #00f0ff; 
  border-radius:12px; 
  box-shadow:0 0 40px #00f0ff44; 
  background:#050510; 
  cursor:none;
}
#ui { 
  position:absolute; 
  top:20px; 
  left:20px; 
  background:rgba(0,0,0,0.7); 
  padding:15px 20px; 
  border-radius:10px; 
  border:1px solid #00f0ff; 
  z-index:10;
}
#ui h1 { font-size:18px; margin-bottom:8px; color:#00f0ff; }
.health-bar { width:200px; height:20px; background:#333; border-radius:10px; overflow:hidden; margin:8px 0; border:1px solid #fff; }
.health-fill { height:100%; width:100%; background:linear-gradient(90deg,#0f0,#ff0,#f00); transition:width 0.2s; }
#score { font-size:20px; color:#ff0; }
#msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; color:#ff0; text-shadow:0 0 20px #f00; display:none; z-index:20; }
button { 
  margin-top:10px; 
  padding:8px 16px; 
  background:#00f0ff; 
  border:none; 
  border-radius:6px; 
  color:#000; 
  font-weight:bold; 
  cursor:pointer; 
}
button:hover { background:#0ff; }
</style>
</head>
<body>
<div id="ui">
  <h1>🎯 Hex Shooter Vui Nhộn</h1>
  <div>Máu:</div>
  <div class="health-bar"><div class="health-fill" id="hp"></div></div>
  <div id="score">Điểm: 0</div>
  <div style="font-size:12px; margin-top:8px; opacity:0.8;">WASD di chuyển | Chuột lia tâm & bắn</div>
  <button onclick="restart()">Chơi lại</button>
</div>
<div id="msg">GAME OVER!</div>
<canvas id="game" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hpFill = document.getElementById('hp');
const scoreEl = document.getElementById('score');
const msg = document.getElementById('msg');

let player = { x:450, y:300, r:18, color:'#ffdd00', hp:100, maxHp:100, speed:3.2, angle:0 };
let enemies = [];
let bullets = [];
let particles = [];
let floatingTexts = [];
let score = 0;
let mouse = { x:450, y:300 };
let keys = {};
let running = true;
let lastShot = 0;

const colors = ['#ff4444','#44ff44','#4444ff','#ff44ff','#44ffff','#ff8844','#88ff44'];

function spawnEnemy() {
  const side = Math.floor(Math.random()*4);
  let x, y;
  if (side===0) { x = Math.random()*900; y = -30; }
  else if (side===1) { x = 930; y = Math.random()*600; }
  else if (side===2) { x = Math.random()*900; y = 630; }
  else { x = -30; y = Math.random()*600; }
  enemies.push({
    x, y, r:16 + Math.random()*8,
    color: colors[Math.floor(Math.random()*colors.length)],
    hp: 40 + Math.random()*40,
    maxHp: 60,
    speed: 1.2 + Math.random()*1.2,
    shootTimer: Math.random()*100
  });
}

function restart() {
  player = { x:450, y:300, r:18, color:'#ffdd00', hp:100, maxHp:100, speed:3.2, angle:0 };
  enemies = [];
  bullets = [];
  particles = [];
  floatingTexts = [];
  score = 0;
  scoreEl.textContent = 'Điểm: 0';
  hpFill.style.width = '100%';
  msg.style.display = 'none';
  running = true;
  for(let i=0;i<6;i++) spawnEnemy();
}

function drawHexGrid() {
  const size = 32;
  const h = size * Math.sqrt(3);
  ctx.strokeStyle = '#00aaff44';
  ctx.lineWidth = 1.5;
  for(let q=-2; q<30; q++) {
    for(let r=-2; r<20; r++) {
      const x = size * (3/2 * q) + 20;
      const y = size * (Math.sqrt(3)/2 * q + Math.sqrt(3) * r) + 20;
      if (x > -50 && x < 950 && y > -50 && y < 650) {
        ctx.beginPath();
        for(let i=0;i<6;i++) {
          const ang = Math.PI/3 * i + Math.PI/6;
          const px = x + size * Math.cos(ang);
          const py = y + size * Math.sin(ang);
          if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }
  }
}

function drawCharacter(e, isPlayer) {
  ctx.fillStyle = e.color;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = isPlayer ? '#fff' : e.color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r+6, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(e.x + Math.cos(e.angle||0)*e.r*0.4, e.y + Math.sin(e.angle||0)*e.r*0.4, e.r*0.35, 0, Math.PI*2);
  ctx.fill();
}

function drawHealthBar(e) {
  const w = e.r*2.5;
  const h = 6;
  const x = e.x - w/2;
  const y = e.y - e.r - 14;
  ctx.fillStyle = '#333';
  ctx.fillRect(x, y, w, h);
  const ratio = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = ratio > 0.5 ? '#0f0' : ratio > 0.25 ? '#ff0' : '#f00';
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
}

function shoot(from, angle, color, speed=8, damage=15) {
  bullets.push({
    x: from.x + Math.cos(angle)*from.r,
    y: from.y + Math.sin(angle)*from.r,
    vx: Math.cos(angle)*speed,
    vy: Math.sin(angle)*speed,
    r: 5,
    color,
    damage,
    fromPlayer: from === player
  });
}

function spawnParticles(x, y, color, n=12) {
  for(let i=0;i<n;i++) {
    const a = Math.random()*Math.PI*2;
    const s = 2 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      life: 30 + Math.random()*20,
      color
    });
  }
}

function addFloat(x, y, text) {
  floatingTexts.push({ x, y, text, life: 50, vy: -1.5 });
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', () => {
  if (running && Date.now() - lastShot > 180) {
    player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    shoot(player, player.angle, '#fff', 10, 20);
    lastShot = Date.now();
  }
});
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function update() {
  if (!running) return;
  let dx=0, dy=0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx||dy) {
    const len = Math.hypot(dx,dy);
    player.x += (dx/len)*player.speed;
    player.y += (dy/len)*player.speed;
    player.x = Math.max(20, Math.min(880, player.x));
    player.y = Math.max(20, Math.min(580, player.y));
  }
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  enemies.forEach((e, i) => {
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    e.angle = ang;
    e.x += Math.cos(ang) * e.speed;
    e.y += Math.sin(ang) * e.speed;
    e.shootTimer--;
    if (e.shootTimer <= 0 && Math.hypot(player.x-e.x, player.y-e.y) < 400) {
      shoot(e, ang, e.color, 5, 10);
      e.shootTimer = 80 + Math.random()*60;
    }
  });

  bullets.forEach((b, bi) => {
    b.x += b.vx;
    b.y += b.vy;
    if (b.x < -20 || b.x > 920 || b.y < -20 || b.y > 620) {
      bullets.splice(bi,1);
      return;
    }
    if (!b.fromPlayer && Math.hypot(b.x-player.x, b.y-player.y) < player.r + b.r) {
      player.hp -= b.damage;
      spawnParticles(b.x, b.y, '#ff4444');
      addFloat(player.x, player.y-30, 'Ái da!');
      bullets.splice(bi,1);
      if (player.hp <= 0) {
        player.hp = 0;
        running = false;
        msg.style.display = 'block';
        msg.textContent = 'GAME OVER! Điểm: ' + score;
      }
      return;
    }
    if (b.fromPlayer) {
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        if (Math.hypot(b.x-e.x, b.y-e.y) < e.r + b.r) {
          e.hp -= b.damage;
          spawnParticles(e.x, e.y, e.color);
          addFloat(e.x, e.y-20, Math.random()>0.5 ? 'Ouch!' : 'Bắn trúng!');
          bullets.splice(bi,1);
          if (e.hp <= 0) {
            score += 10;
            scoreEl.textContent = 'Điểm: ' + score;
            spawnParticles(e.x, e.y, '#fff', 25);
            addFloat(e.x, e.y, '+10');
            enemies.splice(ei,1);
            if (Math.random() < 0.7) spawnEnemy();
          }
          break;
        }
      }
    }
  });

  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  });
  floatingTexts.forEach((t, i) => {
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i,1);
  });

  if (enemies.length < 5 && Math.random() < 0.02) spawnEnemy();

  const ratio = Math.max(0, player.hp / player.maxHp);
  hpFill.style.width = (ratio*100) + '%';
  hpFill.style.background = ratio > 0.5 ? 'linear-gradient(90deg,#0f0,#ff0)' : ratio > 0.25 ? '#ff0' : '#f00';
}

function draw() {
  ctx.clearRect(0,0,900,600);
  const g = ctx.createRadialGradient(450,300,50,450,300,500);
  g.addColorStop(0, '#111122');
  g.addColorStop(1, '#050510');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,900,600);

  drawHexGrid();

  particles.forEach(p => {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  bullets.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  enemies.forEach(e => {
    drawCharacter(e, false);
    drawHealthBar(e);
  });

  drawCharacter(player, true);
  drawHealthBar(player);

  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 12, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x-18, mouse.y);
  ctx.lineTo(mouse.x+18, mouse.y);
  ctx.moveTo(mouse.x, mouse.y-18);
  ctx.lineTo(mouse.x, mouse.y+18);
  ctx.stroke();

  floatingTexts.forEach(t => {
    ctx.globalAlpha = t.life / 50;
    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
